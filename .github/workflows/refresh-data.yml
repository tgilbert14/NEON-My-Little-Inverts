name: Propose immutable NEON invert refresh

# Producer -> independent validator -> restricted publisher. Scheduled runs
# rebuild derived files from the committed 34-site bundle. The expensive NEON
# download is manual-only. Only independently validated bytes reach a review
# branch; this workflow never pushes main or creates/approves its own PR.

on:
  schedule:
    # Every Saturday 13:17 UTC == 06:17 America/Phoenix (no DST), clear of the
    # UTC-midnight edge. Cron cannot say "Nth Saturday of the month", so it fires
    # weekly and the gate job's shared calendar block picks the refresh week.
    - cron: "17 13 * * 6"
  workflow_dispatch:
    inputs:
      skip_download:
        description: "Skip the heavy NEON re-pull; rebuild from committed 34-site bundles"
        type: boolean
        default: true
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: invert-data-refresh
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
  OPENBLAS_CORETYPE: Haswell
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout the committed source receipt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Watch NEON for a newer release and new issue-log entries
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRODUCT_URL: https://data.neonscience.org/api/v0/products/DP1.20120.001
        run: |
          # Anonymous product-metadata call. A network or API failure only warns:
          # the network must never fail a pull request. A newer NEON release fails
          # the scheduled run loudly; new issue-log entries only warn.
          set -euo pipefail
          body=$(mktemp)
          if ! curl -fsS --retry 3 --retry-all-errors --max-time 60 -o "$body" "$PRODUCT_URL"; then
            echo "::warning title=NEON release watch skipped::Could not read $PRODUCT_URL; the release and issue-log watch did not run."
            rm -f "$body"
            exit 0
          fi
          pinned=$(jq -r '.release.tag' data/source_receipt.json)
          fetched=$(jq -r '.fetched_at_utc' data/source_receipt.json)
          latest=$(jq -r '.data.releases[]?.release // empty' "$body" | sort -V | tail -n 1) || latest=""
          if [ -z "$latest" ]; then
            echo "::warning title=NEON release watch skipped::$PRODUCT_URL listed no releases."
          elif [ "$latest" != "$pinned" ] && [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n 1)" = "$latest" ]; then
            message="NEON published $latest; this app is pinned to $pinned. Follow the release-bump procedure in README.md, then dispatch the refresh with skip_download=false."
            if [ "$EVENT_NAME" = "schedule" ]; then
              echo "::error title=Newer NEON release::$message"
              echo "Release watch: $message" >> "$GITHUB_STEP_SUMMARY"
              newer_release=true
            else
              echo "::warning title=Newer NEON release::$message"
              echo "Release watch: $message" >> "$GITHUB_STEP_SUMMARY"
              newer_release=false
            fi
          else
            echo "Release watch: newest NEON release is $latest; this app is pinned to $pinned." | tee -a "$GITHUB_STEP_SUMMARY"
            newer_release=false
          fi
          entries=$(jq -r --arg fetched "$fetched" '
            .data.changeLogs[]? | select((.issueDate // "") > $fetched)
            | "\((.issueDate // "")[0:10]) \((.issue // "") | gsub("[\r\n]+"; " ") | .[0:300])"' "$body") || entries=""
          rm -f "$body"
          if [ -n "$entries" ]; then
            echo "Issue-log entries NEON added after the $fetched fetch:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r entry; do
              echo "::warning title=New NEON issue-log entry::$entry"
              echo "- $entry" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$entries"
          else
            echo "Issue-log watch: no NEON issue-log entry is newer than the $fetched fetch." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$newer_release" = true ]; then
            exit 1
          fi

      - id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REFRESH_WEEK: "1"
        run: |
          # Shared NEON-suite calendar gate. Keep this block byte-identical in every
          # repo; only the REFRESH_WEEK value above it differs. The cron fires every
          # Saturday 13:17 UTC (06:17 America/Phoenix, no DST). GitHub can start a
          # scheduled run hours late, so the gate judges the Saturday the run was
          # scheduled for, not the wall clock: it steps back to the most recent Phoenix
          # Saturday (today, on a Saturday) and proceeds only when that Saturday falls in
          # week REFRESH_WEEK of its month (week 1 = days 1-7, week 2 = days 8-14).
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Calendar gate: $EVENT_NAME run, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          started=$(TZ='America/Phoenix' date -d "@$now" '+%F %H:%M')
          dow=$(TZ='America/Phoenix' date -d "@$now" +%u)   # 1 = Monday ... 6 = Saturday, 7 = Sunday
          lag_days=$(( (dow + 1) % 7 ))                     # whole days since the most recent Saturday
          saturday_at=$(( now - lag_days * 86400 ))         # Phoenix has no DST, so a day is 86400 s
          saturday=$(TZ='America/Phoenix' date -d "@$saturday_at" +%F)
          saturday_week=$(( ($(TZ='America/Phoenix' date -d "@$saturday_at" +%-d) + 6) / 7 ))
          today_week=$(( ($(TZ='America/Phoenix' date -d "@$now" +%-d) + 6) / 7 ))
          if [ "$saturday_week" = "$REFRESH_WEEK" ]; then
            echo "Calendar gate: run for Saturday $saturday (week $saturday_week) started $started Phoenix, proceeding." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPED_BY_CALENDAR: run for Saturday $saturday is week $saturday_week, not week $REFRESH_WEEK (started $started Phoenix)." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$today_week" = "$REFRESH_WEEK" ]; then
              echo "::warning title=Refresh skipped in its refresh week::Saturday $saturday is week $saturday_week, but this run started $started Phoenix, inside week $REFRESH_WEEK. Confirm the week-$REFRESH_WEEK Saturday run proceeds."
            fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe a NEON data endpoint with the token
        if: steps.check.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
          PROBE_URL: https://data.neonscience.org/api/v0/data/DP1.20120.001/ARIK/2023-11
        run: |
          # Shared NEON-suite token probe. Keep this block byte-identical in every repo;
          # only PROBE_URL differs. NEON data endpoints refuse anonymous requests, so a
          # missing or rejected token fails here, named, before any download starts.
          set -euo pipefail
          if [ -z "${NEON_TOKEN:-}" ]; then
            echo "::error title=Missing NEON token::Set the NEON_TOKEN repository secret; NEON data endpoints refuse anonymous requests."
            echo "NEON token probe: the NEON_TOKEN secret is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --retry 3 --retry-all-errors --max-time 60 -o "$body" -w '%{http_code}' \
            -H "X-API-Token: $NEON_TOKEN" "$PROBE_URL") || code=000
          files=$(jq -r '.data.files | length' "$body" 2>/dev/null) || files=0
          rm -f "$body"
          if [ "$code" != "200" ] || ! [ "$files" -ge 1 ] 2>/dev/null; then
            echo "::error title=NEON token rejected::HTTP $code with $files files from $PROBE_URL; check or rotate the NEON_TOKEN secret."
            echo "NEON token probe: HTTP $code, $files files from $PROBE_URL." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "NEON token probe: HTTP 200, $files files from $PROBE_URL." | tee -a "$GITHUB_STEP_SUMMARY"

  produce_candidate:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout immutable producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          cran: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
          use-public-rspm: false

      - name: Install producer dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/neonUtilities_4.0.1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/bsicons_0.1.2.tar.gz,
            dplyr, tibble, jsonlite, digest
          pak-version: stable
          dependencies: '"hard"'
          cache-version: invert-producer-source-contract-v4
          install-pandoc: "false"
          install-quarto: "false"

      - name: Test the offline RELEASE-2026 source, science, and producer contracts
        run: |
          Rscript --vanilla scripts/test_inv_source_contract.R
          Rscript --vanilla scripts/test_inv_science_contract.R
          Rscript --vanilla scripts/test_inv_producer.R
          Rscript --vanilla scripts/test_inv_release_verifier.R
          Rscript --vanilla scripts/check_loaded_app_contract.R

      # Schedule inputs are absent and therefore must never select this step.
      # A full fetch is possible only through an explicit manual false input.
      - name: Fetch and receipt-verify the exact source (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_download == false }}
        timeout-minutes: 240
        env:
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/fetch_inv_all.R
          test -f ../inverts-data-fetch/DP1.20120.001_all.rds
          test -f ../inverts-data-fetch/DP1.20120.001_fetch_evidence.json
          test -f ../inverts-data-fetch/DP1.20120.001_source_receipt.json
          Rscript --vanilla -e 'source("scripts/inv_source_contract.R"); inv_verify_fetch_evidence("../inverts-data-fetch/DP1.20120.001_all.rds", "../inverts-data-fetch/DP1.20120.001_fetch_evidence.json")'
          Rscript --vanilla -e 'source("scripts/inv_source_contract.R"); inv_verify_source_receipt("../inverts-data-fetch/DP1.20120.001_all.rds", "../inverts-data-fetch/DP1.20120.001_source_receipt.json")'

      - name: Stage exact raw fetch evidence and conditional authority
        id: source_stage
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.skip_download == false }}
        run: |
          set -euo pipefail
          if [[ ! -f ../inverts-data-fetch/DP1.20120.001_all.rds || \
                ! -f ../inverts-data-fetch/DP1.20120.001_fetch_evidence.json ]]; then
            echo "No raw source evidence exists; preserving the primary fetch failure only."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_stage="$RUNNER_TEMP/invert-source"
          mkdir "$source_stage"
          cp -- ../inverts-data-fetch/DP1.20120.001_all.rds "$source_stage/DP1.20120.001_all.rds"
          cp -- ../inverts-data-fetch/DP1.20120.001_fetch_evidence.json "$source_stage/DP1.20120.001_fetch_evidence.json"
          if [[ -f ../inverts-data-fetch/DP1.20120.001_source_receipt.json ]]; then
            cp -- ../inverts-data-fetch/DP1.20120.001_source_receipt.json "$source_stage/DP1.20120.001_source_receipt.json"
            expected=$(printf '%s\n' DP1.20120.001_all.rds DP1.20120.001_fetch_evidence.json DP1.20120.001_source_receipt.json | LC_ALL=C sort)
          else
            expected=$(printf '%s\n' DP1.20120.001_all.rds DP1.20120.001_fetch_evidence.json | LC_ALL=C sort)
          fi
          actual=$(find "$source_stage" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Raw fetch artifact members differ from the exact conditional allowlist."
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload raw fetch evidence and authority when available
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.skip_download == false && steps.source_stage.outputs.ready == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invert-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/invert-source/
          if-no-files-found: error
          retention-days: 90

      - name: Bundle the exact 34-site product (manual only)
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.skip_download == false }}
        timeout-minutes: 60
        run: |
          set -euo pipefail
          rm -f data/sites/*.rds data/release_contract.rds data/source_receipt.json
          rm -f data/site_index.rds data/cross_site.rds data/search_index.rds data-sample/demo.rds
          Rscript --vanilla scripts/build_inv_data.R

      - name: Verify and package the immutable producer bundle
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          Rscript --vanilla -e 'source("scripts/inv_release_verifier.R"); summary <- inv_verify_release_data("."); stopifnot(identical(summary$sites, 34L))'
          expected_sites=(ARIK BARC BIGC BLDE BLUE BLWA CARI COMO CRAM CUPE FLNT GUIL HOPB KING LECO LEWI LIRO MART MAYF MCDI MCRA OKSR POSE PRIN PRLA PRPO REDB SUGG SYCA TECR TOMB TOOK WALK WLOU)
          producer_paths=(data/release_contract.rds data/source_receipt.json)
          for site in "${expected_sites[@]}"; do
            producer_paths+=("data/sites/${site}.rds")
          done
          expected_inventory=$(printf '%s\n' "${producer_paths[@]}" | grep '^data/sites/' | LC_ALL=C sort)
          actual_inventory=$(find data/sites -maxdepth 1 -type f -print | LC_ALL=C sort)
          if [[ "$actual_inventory" != "$expected_inventory" ]]; then
            echo "Producer site inventory differs from the exact release allowlist."
            diff <(printf '%s\n' "$expected_inventory") <(printf '%s\n' "$actual_inventory") || true
            exit 1
          fi
          for path in data/release_contract.rds data/source_receipt.json; do
            test -f "$path"
          done
          git diff --check
          tar -czf "$RUNNER_TEMP/invert-produced.tgz" "${producer_paths[@]}"

      - name: Upload producer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invert-produced-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/invert-produced.tgz
          if-no-files-found: error
          retention-days: 7

  validate_candidate:
    needs: [gate, produce_candidate]
    if: needs.gate.outputs.run == 'true' && needs.produce_candidate.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout immutable validator revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5.2"
          cran: https://packagemanager.posit.co/cran/__linux__/jammy/2026-07-15
          use-public-rspm: false

      # pak also exposes a moving CRAN fallback. Keep bslib on the dated 0.11.0
      # source explicitly so a newer fallback-only release cannot enter the
      # retained Connect manifest while the rest of the closure uses RSPM.
      - name: Install validator and runtime dependencies
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: >
            shiny, bsicons, dplyr, tibble, tidyr, stringr, rsconnect,
            jsonlite, digest, shinyjs, shinycssloaders, RColorBrewer, htmltools, cpp11,
            leaflet, DT,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/bslib_0.11.0.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/plotly_4.12.0.tar.gz,
            url::https://cran.r-project.org/src/contrib/Archive/terra/terra_1.8-50.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sf_1.1-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/s2_1.1.11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/units_1.0-1.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/wk_0.9.5.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/classInt_0.4-11.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/raster_3.6-32.tar.gz,
            url::https://packagemanager.posit.co/cran/2026-07-15/src/contrib/sp_2.2-1.tar.gz
          pak-version: stable
          dependencies: '"hard"'
          cache-version: invert-validator-geo-bslib-v3
          install-pandoc: "false"
          install-quarto: "false"

      - name: Verify the pinned UI dependency contract before candidate work
        run: Rscript --vanilla scripts/check_loaded_app_contract.R

      - name: Download immutable producer candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: invert-produced-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate

      - name: Download exact raw source for independent validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_download == false }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: invert-source-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/source

      - name: Materialize candidate in the clean validator checkout
        run: |
          set -euo pipefail
          expected_sites=(ARIK BARC BIGC BLDE BLUE BLWA CARI COMO CRAM CUPE FLNT GUIL HOPB KING LECO LEWI LIRO MART MAYF MCDI MCRA OKSR POSE PRIN PRLA PRPO REDB SUGG SYCA TECR TOMB TOOK WALK WLOU)
          expected_members=$(printf 'data/sites/%s.rds\n' "${expected_sites[@]}"; printf '%s\n' data/release_contract.rds data/source_receipt.json)
          expected_members=$(printf '%s\n' "$expected_members" | LC_ALL=C sort)
          actual_members=$(tar -tzf "$RUNNER_TEMP/candidate/invert-produced.tgz" | LC_ALL=C sort)
          if [[ "$actual_members" != "$expected_members" ]]; then
            echo "Producer artifact members differ from the exact site allowlist."
            diff <(printf '%s\n' "$expected_members") <(printf '%s\n' "$actual_members") || true
            exit 1
          fi
          cp data/site_index.rds "$RUNNER_TEMP/committed-site-index.rds"
          rm -f data/sites/*.rds data/release_contract.rds data/source_receipt.json
          tar -xzf "$RUNNER_TEMP/candidate/invert-produced.tgz"

      - name: Independently rebuild derived data and preliminary deploy manifest
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/build_cross_site.R
          Rscript --vanilla scripts/build_search_index.R
          INV_MANIFEST_PHASE=prestamp Rscript --vanilla scripts/write_manifest.R

      - name: Build and verify the exact Pages and Connect release identity
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_release_identity.R
          bash scripts/test_post_deploy_smoke.sh
          INV_RELEASE_IDENTITY_MODE=write INV_WRITE_PAGES_RELEASE=1 Rscript --vanilla scripts/write_release_identity.R
          INV_MANIFEST_PHASE=final Rscript --vanilla scripts/write_manifest.R
          INV_RELEASE_IDENTITY_MODE=verify INV_WRITE_PAGES_RELEASE=1 Rscript --vanilla scripts/write_release_identity.R
          cmp -s release/production-identity.json docs/release.json

      - name: Reject a stale committed identity on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          identity_paths=(manifest.json release/production-identity.json docs/release.json)
          for path in "${identity_paths[@]}"; do
            git ls-files --error-unmatch "$path" >/dev/null
          done
          git diff --exit-code -- "${identity_paths[@]}"

      - name: Independently reconcile the full-fetch source to the candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_download == false }}
        env:
          RAW_SOURCE: ${{ runner.temp }}/source/DP1.20120.001_all.rds
          RAW_EVIDENCE: ${{ runner.temp }}/source/DP1.20120.001_fetch_evidence.json
          RAW_RECEIPT: ${{ runner.temp }}/source/DP1.20120.001_source_receipt.json
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' DP1.20120.001_all.rds DP1.20120.001_fetch_evidence.json DP1.20120.001_source_receipt.json | LC_ALL=C sort)
          actual=$(find "$RUNNER_TEMP/source" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Raw source artifact members differ from the exact allowlist."
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          Rscript --vanilla -e 'source("scripts/inv_source_contract.R", local = TRUE); inv_verify_fetch_source_handoff(Sys.getenv("RAW_SOURCE"), Sys.getenv("RAW_EVIDENCE"), Sys.getenv("RAW_RECEIPT"))'
          Rscript --vanilla -e 'source("scripts/inv_release_verifier.R", local = TRUE); inv_verify_release_against_source(".", Sys.getenv("RAW_SOURCE"), Sys.getenv("RAW_RECEIPT"))'

      - name: Verify the static and in-app Living Poster contract
        run: |
          set -euo pipefail
          node --check scripts/check_cover.mjs
          node --check scripts/post_deploy_browser.mjs
          node scripts/check_cover.mjs

      - name: Verify the exact release candidate
        run: |
          set -euo pipefail
          Rscript --vanilla scripts/test_inv_source_contract.R
          Rscript --vanilla scripts/test_inv_science_contract.R
          Rscript --vanilla scripts/test_inv_producer.R
          Rscript --vanilla scripts/test_inv_release_verifier.R
          Rscript --vanilla scripts/check_loaded_app_contract.R
          Rscript --vanilla scripts/verify_refresh_candidate.R "$RUNNER_TEMP/committed-site-index.rds"
          # shellcheck disable=SC2016
          Rscript --vanilla -e 'source("global.R"); source("ui.R"); candidate <- source("server.R")$value; stopifnot(inherits(ui, "shiny.tag.list") || inherits(ui, "shiny.tag"), is.function(candidate))'
          node --check www/app.js
          node --check scripts/check_custom_message_handlers.mjs
          node scripts/check_custom_message_handlers.mjs
          git diff --check

      - name: Package immutable validated candidate
        run: |
          set -euo pipefail
          expected_sites=(ARIK BARC BIGC BLDE BLUE BLWA CARI COMO CRAM CUPE FLNT GUIL HOPB KING LECO LEWI LIRO MART MAYF MCDI MCRA OKSR POSE PRIN PRLA PRPO REDB SUGG SYCA TECR TOMB TOOK WALK WLOU)
          release_paths=(data/release_contract.rds data/source_receipt.json data/site_index.rds data/cross_site.rds data/search_index.rds data-sample/demo.rds release/production-identity.json docs/release.json manifest.json)
          for site in "${expected_sites[@]}"; do
            release_paths+=("data/sites/${site}.rds")
          done
          for path in "${release_paths[@]}"; do
            test -f "$path"
          done
          expected_scoped=$(printf '%s\n' "${release_paths[@]}" | grep -E '^(data|data-sample)/' | LC_ALL=C sort)
          actual_scoped=$(find data data-sample -type f -print | LC_ALL=C sort)
          if [[ "$actual_scoped" != "$expected_scoped" ]]; then
            echo "Validated data inventory differs from the exact publication allowlist."
            diff <(printf '%s\n' "$expected_scoped") <(printf '%s\n' "$actual_scoped") || true
            exit 1
          fi
          tar -czf "$RUNNER_TEMP/invert-refresh.tgz" "${release_paths[@]}"

      - name: Upload validated candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: invert-refresh-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/invert-refresh.tgz
          if-no-files-found: error
          retention-days: 7

  publish_candidate:
    needs: [gate, validate_candidate]
    if: github.event_name != 'pull_request' && needs.gate.outputs.run == 'true' && needs.validate_candidate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout validated producer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Download exact validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: invert-refresh-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate

      - name: Publish or update the review branch, never main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main "$SOURCE_SHA"; then
            echo "Producer revision does not contain current main; refusing stale publication."
            exit 1
          fi
          expected_sites=(ARIK BARC BIGC BLDE BLUE BLWA CARI COMO CRAM CUPE FLNT GUIL HOPB KING LECO LEWI LIRO MART MAYF MCDI MCRA OKSR POSE PRIN PRLA PRPO REDB SUGG SYCA TECR TOMB TOOK WALK WLOU)
          release_paths=(data/release_contract.rds data/source_receipt.json data/site_index.rds data/cross_site.rds data/search_index.rds data-sample/demo.rds release/production-identity.json docs/release.json manifest.json)
          for site in "${expected_sites[@]}"; do
            release_paths+=("data/sites/${site}.rds")
          done
          expected_members=$(printf '%s\n' "${release_paths[@]}" | LC_ALL=C sort)
          actual_members=$(tar -tzf "$RUNNER_TEMP/candidate/invert-refresh.tgz" | LC_ALL=C sort)
          if [[ "$actual_members" != "$expected_members" ]]; then
            echo "Validated artifact members differ from the exact publication allowlist."
            diff <(printf '%s\n' "$expected_members") <(printf '%s\n' "$actual_members") || true
            exit 1
          fi
          rm -f -- "${release_paths[@]}"
          tar -xzf "$RUNNER_TEMP/candidate/invert-refresh.tgz"

          branch="automation/invert-data-refresh"
          remote_head=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
          git switch -C "$branch"
          git config user.name "neon-data-bot"
          git config user.email "neon-data-bot@users.noreply.github.com"
          git add -- "${release_paths[@]}"
          if git diff --cached --quiet -- "${release_paths[@]}"; then
            echo "No validated candidate change, including untracked scoped files."
            exit 0
          fi
          git commit -m "data: propose validated invert refresh [bot]" \
                     -m "Produced from ${SOURCE_SHA}; exact 34-site roster, deterministic search index, app source, and manifest checksums passed independent validation."
          published_commit=$(git rev-parse HEAD)
          if [[ "$(git rev-parse HEAD^)" != "$SOURCE_SHA" ]]; then
            echo "Candidate promotion commit is not a direct child of the validated producer revision."
            exit 1
          fi
          if [ -n "$remote_head" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_head" \
              origin "$branch:refs/heads/$branch"
          else
            git push origin "$branch:refs/heads/$branch"
          fi

          pushed_commit=""
          for _attempt in 1 2 3 4 5; do
            pushed_commit=$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')
            [[ "$pushed_commit" == "$published_commit" ]] && break
            sleep 2
          done
          if [[ "$pushed_commit" != "$published_commit" ]]; then
            echo "Published branch does not resolve to the validated candidate commit."
            exit 1
          fi

          pr_count=$(gh pr list --head "$branch" --base main --state open \
            --json url --jq 'length')
          if (( pr_count > 1 )); then
            echo "More than one open main PR exists for $branch; refusing ambiguous publication."
            exit 1
          fi
          if (( pr_count == 0 )); then
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            {
              echo "### Validated My Little Inverts review branch ready"
              echo "- Branch: \`$branch\`"
              echo "- Exact head: \`$published_commit\`"
              echo "- Validator run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- [Open the reviewer-authenticated PR]($compare_url)"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Validated review branch ready::Open a reviewer-authenticated PR from $branch to main after reviewing run ${GITHUB_RUN_ID}; that PR event is the exact-head CI trigger."
            # Tell a person a validated branch is waiting: one open tracking issue,
            # commented on each later run. A failure here warns and never fails the
            # publish; the workflow still never opens or approves its own PR.
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            issue_body="A validated invert data refresh is waiting for review.

          - Branch: \`$branch\`
          - Exact head: \`$published_commit\`
          - Validator run: $run_url
          - Compare and open the PR: $compare_url

          Review the run, then open a PR from \`$branch\` to main yourself; that PR is the exact-head CI trigger. This workflow never opens, approves, or merges its own PR."
            gh label create data-refresh --color 0e8f9c \
              --description "Validated data refresh waiting for review" --force >/dev/null 2>&1 || true
            if issue_number=$(gh issue list --state open --label data-refresh --limit 1 \
                --json number --jq '.[0].number // empty'); then
              if [ -n "$issue_number" ]; then
                gh issue comment "$issue_number" --body "$issue_body" >/dev/null \
                  || echo "::warning title=Review issue not updated::Could not comment on tracking issue #$issue_number; review branch $branch at $published_commit is still waiting."
              else
                gh issue create --title "Validated invert refresh ready for review" \
                  --label data-refresh --body "$issue_body" >/dev/null \
                  || echo "::warning title=Review issue not opened::Could not open the data-refresh tracking issue; review branch $branch at $published_commit is still waiting."
              fi
            else
              echo "::warning title=Review issue not checked::Could not list data-refresh issues; review branch $branch at $published_commit is still waiting."
            fi
            exit 0
          fi

          pr_record=""
          for _attempt in 1 2 3 4 5; do
            pr_record=$(gh pr list --head "$branch" --base main --state open \
              --json url,baseRefName,headRefName,headRefOid \
              --jq 'if length == 1 then .[0] | [.url,.baseRefName,.headRefName,.headRefOid] | @tsv else "" end')
            [[ "$pr_record" == *$'\t'"$published_commit" ]] && break
            sleep 2
          done
          IFS=$'\t' read -r pr_url pr_base pr_head pr_oid <<< "$pr_record"
          if [[ -z "$pr_record" || "$pr_base" != main || "$pr_head" != "$branch" || \
                "$pr_oid" != "$published_commit" ]]; then
            echo "Open PR identity does not match main <- $branch at $published_commit."
            exit 1
          fi
          gh pr comment "$pr_url" \
            --body "Updated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. GitHub will hold pull_request synchronize checks triggered by this automation update for approval; a repository write user must select **Approve workflows to run**. Do not merge until checks are green on exact head ${published_commit}."
          echo "::notice title=Approve exact-head PR checks::Existing PR updated to $published_commit. A repository write user must select Approve workflows to run, then verify green checks on that exact head."
